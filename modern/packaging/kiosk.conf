# ViewTouch kiosk screen settings (vtmodern-kiosk.service). One
# "option = value" per line; any option from "vtmodern --help" works here
# without the dashes. vtmodern-setup writes the first block for you.
# After a change: sudo systemctl restart vtmodern-kiosk

# --- set by vtmodern-setup ---
# This screen keeps the data and lets other terminals join:
serve = yes
# ...or it joins a server instead (then its own data is not used):
#connect = 192.168.1.10
#terminal = Bar
# --- end ---

# Start on this page instead of the login page (e.g. kitchen for a kitchen
# screen that needs no login).
#page = kitchen

# Backups (only when this screen keeps the data).
#backup-dir = /mnt/usb/viewtouch-backups
#backup-keep = 30
#backup-every = 24
