name: Linux builds (basic)

on: [push, pull_request]

jobs:
  build:
    name: ${{matrix.cxx}}, C++${{matrix.std}}, ${{matrix.build_type}}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Toolchains that can actually build this project at C++23 on
        # ubuntu-24.04. g++-12, clang++-16 and clang++-17 were dropped after
        # being tested directly against the tree:
        #
        #   g++-12     vtcore builds but emits 10 "std::format is not available"
        #              warnings, and vtbusiness then fails with
        #              "'format_string' is not a member of 'std'". libstdc++ 12
        #              predates <format>, which cpp23_utils.hh requires and does
        #              not have a working fallback for.
        #   clang++-16 rejects -std=c++23 outright (it only knows -std=c++2b),
        #              and against libstdc++ 14 fails in <ranges> with
        #              "requires clause differs".
        #   clang++-17 fails in libstdc++ 14's <tuple> with "no matching
        #              function". An old clang paired with a new libstdc++.
        #
        # These are toolchain limitations, not defects in ViewTouch: the project
        # requires C++23 with <format>. Re-adding a compiler here means checking
        # it builds vtbusiness, not just vtcore -- vtcore alone does not
        # exercise std::format enough to fail.
        cxx:
          - g++-13
          - g++-14
          - clang++-18
        build_type: [Debug] #, Release]
        # CMakeLists.txt defaults to C++23; CI must build what actually ships.
        std: [23]
        include:
          - cxx: g++-13
            cc: gcc-13
            other_pkgs: g++-13
            cxxflags: "-O1 -fmax-errors=5"
          - cxx: g++-14
            cc: gcc-14
            other_pkgs: g++-14
            cxxflags: "-O1 -fmax-errors=5"
          - cxx: clang++-18
            cc: clang-18
            # libclang-rt-18-dev supplies the ASan/UBSan runtimes. Debug builds
            # turn sanitizers on (ENABLE_SANITIZERS, CMakeLists.txt), and without
            # this package the clang build compiles but fails to link with
            # "cannot find libclang_rt.asan-x86_64.a". GCC needs no equivalent;
            # its sanitizer runtimes ship with the compiler.
            other_pkgs: clang-18 libclang-rt-18-dev
            cxxflags: "-O1 -fmax-errors=5"

    steps:
    - uses: actions/checkout@v4

    - name: Verify directory structure
      run: |
        echo "Verifying directory structure..."
        echo "Contents of root directory:"
        ls -la
        echo ""
        echo "Checking essential directories:"
        for dir in src main scripts assets config docs fonts external/core; do
          if [ -d "$dir" ]; then
            echo "✓ $dir/ exists"
          else
            echo "✗ $dir/ missing"
            exit 1
          fi
        done
        echo "Directory verification complete."

    - name: Prepare environment
      env:
        TZ: "America/Los_Angeles"
      run: |
        sudo ln -snf /usr/share/zoneinfo/${TZ} /etc/localtime
        echo ${TZ} | sudo tee /etc/timezone
        sudo apt-get update -q
        sudo apt-get install -y -y --no-install-recommends \
          ${{matrix.other_pkgs}} \
          build-essential \
          xorg-dev \
          libmotif-dev \
          libfreetype6-dev \
          cmake \
          git \
          xwit \
          xfonts-base \
          xfonts-75dpi \
          xfonts-100dpi \
          tzdata \
          libcurl4-gnutls-dev

    - name: Configure build
      env:
        CC: ${{matrix.cc}}
        CXX: ${{matrix.cxx}}
        CXXFLAGS: ${{matrix.cxxflags}}
      run: |
        echo "Configuring build for ${{matrix.cxx}}..."
        cmake -S . -B _build_${{matrix.cxx}}_${{matrix.std}} \
          -DCMAKE_INSTALL_PREFIX="${PWD}/_install_${{matrix.cxx}}_${{matrix.std}}" \
          -DCMAKE_BUILD_TYPE="${{matrix.build_type}}" \
          -DCMAKE_CXX_STANDARD=${{matrix.std}} \
          -DCMAKE_CXX_EXTENSIONS=OFF \
          -DBUILD_TESTING=ON

    - name: Build + install
      run: |
        echo "Building with ${{matrix.cxx}}..."
        echo "Available CPU cores: $(nproc)"
        echo "Starting build at $(date)..."

        # Run build and capture exit code
        set +e
        timeout 600 cmake --build _build_${{matrix.cxx}}_${{matrix.std}} -j4
        BUILD_EXIT_CODE=$?
        set -e

        echo "Build command completed at $(date) with exit code $BUILD_EXIT_CODE"

        if [ $BUILD_EXIT_CODE -ne 0 ]; then
          echo "Build failed with exit code $BUILD_EXIT_CODE"
          echo "Showing last 100 lines of CMake build output:"
          tail -100 _build_${{matrix.cxx}}_${{matrix.std}}/CMakeFiles/CMakeOutput.log 2>/dev/null || echo "No CMakeOutput.log found"
          echo "Showing last 100 lines of CMake error output:"
          tail -100 _build_${{matrix.cxx}}_${{matrix.std}}/CMakeFiles/CMakeError.log 2>/dev/null || echo "No CMakeError.log found"
          exit $BUILD_EXIT_CODE
        fi

        if [ -f "_build_${{matrix.cxx}}_${{matrix.std}}/vt_main" ]; then
          echo "Build appears successful, proceeding with install..."
          timeout 120 cmake --build _build_${{matrix.cxx}}_${{matrix.std}} --target install
        else
          echo "Build failed - executable not found"
          exit 1
        fi

    - name: Run unit tests
      run: |
        echo "Running unit tests for ${{matrix.cxx}}..."
        ctest --test-dir _build_${{matrix.cxx}}_${{matrix.std}} \
          --output-on-failure \
          --no-tests=error \
          --timeout 300

  coverage:
    name: Test coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Prepare environment
      env:
        TZ: "America/Los_Angeles"
      run: |
        sudo ln -snf /usr/share/zoneinfo/${TZ} /etc/localtime
        echo ${TZ} | sudo tee /etc/timezone
        sudo apt-get update -q
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          xorg-dev \
          libmotif-dev \
          libfreetype6-dev \
          cmake \
          git \
          tzdata \
          libcurl4-gnutls-dev
        pip3 install --break-system-packages gcovr

    - name: Configure with coverage instrumentation
      run: |
        cmake -S . -B _build_coverage \
          -DCMAKE_BUILD_TYPE=Debug \
          -DBUILD_TESTING=ON \
          -DCMAKE_CXX_FLAGS="--coverage -O0" \
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"

    - name: Build tests
      run: cmake --build _build_coverage --target vt_tests -j4

    - name: Run tests
      run: ctest --test-dir _build_coverage --output-on-failure --no-tests=error --timeout 300

    - name: Report coverage
      run: |
        cd _build_coverage
        gcovr --root "${GITHUB_WORKSPACE}" \
          --exclude '.*external/.*' \
          --exclude '.*tests/.*' \
          --exclude '.*_deps.*' \
          --gcov-ignore-errors=no_working_dir_found \
          --print-summary \
          --txt "${GITHUB_WORKSPACE}/coverage.txt" \
          --json-summary "${GITHUB_WORKSPACE}/coverage.json" \
          . | tee "${GITHUB_WORKSPACE}/coverage-summary.txt"

    - name: Enforce coverage ratchet
      run: |
        # The ratchet is on the ABSOLUTE number of covered lines, not on the
        # percentage, and that is deliberate.
        #
        # Business logic currently lives in the vt_main executable, so tests
        # cannot link it and it is absent from the denominator entirely. When
        # that code is extracted into a library and linked into the tests, the
        # denominator grows by tens of thousands of lines at once and the
        # percentage collapses -- as a direct result of making the code more
        # testable. A percentage floor would fail the build for the single most
        # valuable change in the project.
        #
        # Covered-line count has no such failure mode: it rises when tests are
        # added and falls only when tests are deleted, disabled, or broken,
        # which is exactly what this check is meant to catch.
        #
        # Raise MIN_COVERED_LINES as coverage grows. Never lower it to make a
        # build pass.
        MIN_COVERED_LINES=4200

        COVERED=$(python3 -c "import json; print(json.load(open('coverage.json'))['line_covered'])")
        TOTAL=$(python3 -c "import json; print(json.load(open('coverage.json'))['line_total'])")
        PERCENT=$(python3 -c "import json; print(json.load(open('coverage.json'))['line_percent'])")

        echo "Covered lines: ${COVERED} of ${TOTAL} (${PERCENT}%)"
        echo "Floor:         ${MIN_COVERED_LINES} covered lines"

        if [ "${COVERED}" -lt "${MIN_COVERED_LINES}" ]; then
          echo "::error::Covered lines dropped to ${COVERED}, below the floor of ${MIN_COVERED_LINES}. Tests were removed, disabled, or are failing to run."
          exit 1
        fi
        echo "Coverage floor met."

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coverage.txt
          coverage.json
